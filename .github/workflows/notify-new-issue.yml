name: Notify new issue

on:
  issues:
    types: [opened]

jobs:
  email:
    runs-on: ubuntu-latest
    steps:
      - name: Email personal Gmail via FormSubmit
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, urllib.request
          body = os.environ.get("ISSUE_BODY") or ""
          excerpt = body
          if "### Details" in body:
              excerpt = body.split("### Details", 1)[1]
              if "<!-- fairvalet:json -->" in excerpt:
                  excerpt = excerpt.split("<!-- fairvalet:json -->", 1)[0]
              excerpt = excerpt.strip()[:500]
          payload = {
              "_subject": f"FairValet: new GitHub issue #{os.environ['ISSUE_NUMBER']} — {os.environ['ISSUE_TITLE'][:80]}",
              "issue_number": os.environ["ISSUE_NUMBER"],
              "title": os.environ["ISSUE_TITLE"],
              "url": os.environ["ISSUE_URL"],
              "opened_by": os.environ["ISSUE_USER"],
              "excerpt": excerpt,
              "_template": "table",
          }
          data = json.dumps(payload).encode()
          req = urllib.request.Request(
              "https://formsubmit.co/ajax/vgendelman@gmail.com",
              data=data,
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "FairValet-Notify/1.0",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("FormSubmit status", r.status)
                  print(r.read().decode())
          except Exception as e:
              print("FormSubmit failed:", e)
              raise SystemExit(
                  "Could not email via FormSubmit. "
                  f"Issue was {os.environ['ISSUE_URL']}"
              )
          PY
