name: Notify new issue

on:
  issues:
    types: [opened]

jobs:
  email:
    runs-on: ubuntu-latest
    # Notify for pending-report labels or titles starting with "Report:".
    # Skip titles that contain TEST (smoke / do-not-publish issues).
    if: >
      (contains(join(github.event.issue.labels.*.name, ','), 'pending-report')
       || startsWith(github.event.issue.title, 'Report:'))
      && !contains(github.event.issue.title, 'TEST')
    steps:
      - name: Prepare message
        id: prep
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import os
          from pathlib import Path

          body = os.environ.get("ISSUE_BODY") or ""
          excerpt = body
          if "### Details" in body:
              excerpt = body.split("### Details", 1)[1]
              if "<!-- fairvalet:json -->" in excerpt:
                  excerpt = excerpt.split("<!-- fairvalet:json -->", 1)[0]
              excerpt = excerpt.strip()[:500]
          else:
              excerpt = body.strip()[:500]

          number = os.environ["ISSUE_NUMBER"]
          title = os.environ["ISSUE_TITLE"]
          url = os.environ["ISSUE_URL"]
          user = os.environ["ISSUE_USER"]

          subject = f"FairValet: new issue #{number} - {title[:80]}"
          text = "\n".join(
              [
                  f"New FairValet GitHub issue #{number}",
                  "",
                  f"Title: {title}",
                  f"URL: {url}",
                  f"Opened by: {user}",
                  "",
                  "Excerpt:",
                  excerpt or "(no details)",
                  "",
                  "- FairValet notify (GitHub Actions / Vgnoid Gmail)",
              ]
          )
          Path("body.txt").write_text(text, encoding="utf-8")

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"subject={subject}\n")
          print("Prepared notify for", url)
          PY

      - name: Check Gmail App Password secret
        id: creds
        env:
          PASS: ${{ secrets.GMAIL_VGNOID_APP_PASSWORD }}
        run: |
          if [ -z "${PASS}" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret GMAIL_VGNOID_APP_PASSWORD is not set. Skipping Gmail notify (issue intake is unaffected)."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Gmail notify (Vgnoid to vgendelman)
        if: steps.creds.outputs.missing != 'true'
        id: send
        continue-on-error: true
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: Vgnoid@gmail.com
          password: ${{ secrets.GMAIL_VGNOID_APP_PASSWORD }}
          from: FairValet <Vgnoid@gmail.com>
          to: vgendelman@gmail.com
          subject: ${{ steps.prep.outputs.subject }}
          body: file://body.txt

      - name: Log send result
        if: steps.creds.outputs.missing != 'true'
        run: |
          if [ "${{ steps.send.outcome }}" = "success" ]; then
            echo "Gmail notify sent from Vgnoid@gmail.com to vgendelman@gmail.com"
          else
            echo "::warning::Gmail notify failed (non-fatal). Check App Password / SMTP. Issue was ${{ github.event.issue.html_url }}"
          fi
